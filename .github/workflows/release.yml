name: Release GoMagnet Binary

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Static Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # Critical: Configure Git authentication for your private "releasetitleparser" module
      - name: Configure Git for Private Modules
        env:
          PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$PERSONAL_ACCESS_TOKEN" ]; then
            git config --global url."https://${PERSONAL_ACCESS_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
          go env -w GOPRIVATE="github.com/ovrlord-app/*"

      - name: Download Dependencies
        run: go mod download

      - name: Build Static Binaries
        run: |
          mkdir -p dist
          # Compile with CGO disabled and stripping symbols (-s -w) to create highly optimized, alpine-ready binaries
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/gomagnet-linux-amd64 ./cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/gomagnet-linux-arm64 ./cmd/server

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/gomagnet-linux-amd64
            dist/gomagnet-linux-arm64
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
